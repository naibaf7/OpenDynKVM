[package]
name = "xtask"
description = "Build tasks for the OpenDynKVM: both firmwares, their flash images, UF2 files and the partition table; the host software's installers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
kvm-proto.workspace = true
# The application icon for the installers (odkvmctl::icon).
odkvmctl = { path = "../software/odkvmctl" }
anyhow = "1"
sha2 = "0.10"
flate2 = "1"
png = "0.18"
serde_json = "1"
tar = { version = "0.4", default-features = false }
