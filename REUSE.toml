# Licensing of every file in the repository (REUSE 3.3, https://reuse.software). The last matching entry wins, so the
# entries go from general to specific. The license texts are in LICENSES/; README.md ("Licensing") explains the split.
version = 1

# Software: firmware, shared crates, odkvmctl, xtask, their build files and documentation.
[[annotations]]
path = [
    ".cargo/**",
    ".gitignore",
    "Cargo.toml",
    "Cargo.lock",
    "rustfmt.toml",
    "README.md",
    "DEVELOPMENT.md",
    "software.md",
    "crates/**",
    "firmware/**",
    "software/**",
    "xtask/**",
    "branding/**",
]
SPDX-FileCopyrightText = "2026 Fabian Tschopp"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# kvm-vial: the keycode ranges and the Vial request handlers are adapted from RMK (crates/kvm-vial/LICENSE-RMK-MIT).
[[annotations]]
path = ["crates/kvm-vial/src/keycode.rs", "crates/kvm-vial/src/protocol.rs"]
SPDX-FileCopyrightText = ["2024 HaoboGu", "2026 Fabian Tschopp"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The window's text font: Adwaita Sans (derived from Inter), cut down by software/odkvmctl/fonts/make_ui_font.py.
[[annotations]]
path = ["software/odkvmctl/fonts/AdwaitaSans-UI.ttf", "software/odkvmctl/fonts/OFL.txt"]
SPDX-FileCopyrightText = [
    "2016 The Inter Project Authors",
    "2015-2025 Renzhi Li",
    "2025 Jamie Gravendeel",
    "2025 Florian Müllner",
]
SPDX-License-Identifier = "OFL-1.1"

# The window's Chinese text font: Noto Sans CJK SC, cut down by software/odkvmctl/fonts/make_cjk_font.py.
[[annotations]]
path = ["software/odkvmctl/fonts/NotoSansSC-UI.otf", "software/odkvmctl/fonts/OFL-NotoSansCJK.txt"]
SPDX-FileCopyrightText = "2014-2021 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# Hardware: the board, its generators' design data, fabrication outputs and the design documentation.
[[annotations]]
path = ["hardware/**", "design.md", "analysis.md", "report.md", "specs.md", "AGENTS.md"]
SPDX-FileCopyrightText = "2026 Fabian Tschopp"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# General-purpose hardware tools (router, checks, fabrication, solvers), reusable in other projects: MIT, like the
# OpenRower tools they started from. The design-specific generators and data stay CERN-OHL-S (next entry).
[[annotations]]
path = [
    "hardware/tools/*.py",
    "hardware/tools/astar.c",
    "hardware/tools/route_view.html",
    "hardware/debug/**/index.html",
]
SPDX-FileCopyrightText = "2026 Fabian Tschopp"
SPDX-License-Identifier = "MIT"

# The design itself, in its preferred form for modification: symbols, footprints, netlist, placement, JLC placement data.
[[annotations]]
path = [
    "hardware/tools/gen_symbols.py",
    "hardware/tools/gen_footprints.py",
    "hardware/tools/gen_schematic.py",
    "hardware/tools/gen_pcb.py",
    "hardware/tools/jlc_corrections.json",
]
SPDX-FileCopyrightText = "2026 Fabian Tschopp"
SPDX-License-Identifier = "CERN-OHL-S-2.0"

# From the KiCad footprint library (USB_C_Receptacle_HRO_TYPE-C-31-M-12), silk removed on the mating face.
[[annotations]]
path = "hardware/CustomFootprints.pretty/USB_C_Receptacle_HRO_TYPE-C-31-M-12_Edge.kicad_mod"
SPDX-FileCopyrightText = ["KiCad Libraries Team", "2026 Fabian Tschopp"]
SPDX-License-Identifier = "CC-BY-SA-4.0 WITH KiCad-libraries-exception"
