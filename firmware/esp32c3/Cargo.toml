[package]
name = "kvm-esp32c3"
description = "OpenDynKVM firmware for the Bluetooth LE coprocessor, an ESP32-C3-MINI-1 (software.md §4.13)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
kvm-proto = { path = "../../crates/kvm-proto" }
esp-hal = { version = "1.2", features = ["esp32c3", "unstable"] }
esp-rtos = { version = "0.4", features = ["esp32c3", "embassy", "esp-radio"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32c3", "ble", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3"] }
esp-storage = { version = "0.10", features = ["esp32c3"] }
esp-alloc = "0.11"
critical-section = "1.2"
# A connection's event queue holds 16 (trouble-host: 2). A full one drops what comes, `PairingComplete` included: a PC
# changing PHY, data length and connection interval right after encryption filled it, and the bond was lost
# (first dongle, 2026-11-15: Windows paired, connected for a moment, and the KVM never knew).
# Legacy pairing: many Bluetooth keyboards and mice have nothing else (hosts still pair with LE Secure Connections
# only, `ble::run`). A GATT client's notification queue holds 8 (trouble-host: 1, and a full one drops the oldest: a
# key's press or release lost). 32 packets for nine connections.
# log: the stack's warnings and errors (why an encryption failed, among them) into the module's log (`log::Stack`).
trouble-host = { version = "0.8", features = [
    "log",
    "derive",
    "security",
    "legacy-pairing",
    "scan",
    "connection-event-queue-size-16",
    "gatt-client-notification-queue-size-8",
    "default-packet-pool-size-32",
] }
bt-hci = "0.11"
embassy-executor = "0.10"
embassy-time = "0.5.1"
embassy-sync = "0.8"
embassy-futures = "0.1.2"
heapless = "0.9"
embedded-io-async = "0.7"
static_cell = "2.1"
# Warnings and errors only: everything below is compiled out.
log = { version = "0.4", features = ["release_max_level_warn"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"
codegen-units = 1

[profile.dev]
opt-level = "s"

# trouble-host 0.8.0 with one change, marked "OpenDynKVM:" (trouble-host/src/connection_manager.rs; `Stack::link_credits`
# reads it): the controller's ACL buffers are one pool of credits for every connection. Upstream gives each connection
# the whole count, so with several hosts connected the module could hand the controller more packets than it holds; a
# connection whose credits then never came back held up the stack's one send queue, and with it every host (three hosts,
# 2026-11-24).
[patch.crates-io]
trouble-host = { path = "trouble-host" }
